{% extends 'base.html' %}

{% block title %}{{ title }} | Employee Management{% endblock %}

{% block content %}

<!-- changed <section class="panel" ></section> -->

    <section class="panel" style="max-width: 500px; margin: 32px auto;">
    <h1>{{ title }}</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-row">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <div class="actions">
            <button type="submit">Save</button>
            <a class="button secondary" href="{% url 'employee_list' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
