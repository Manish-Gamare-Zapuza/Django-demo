{% extends 'base.html' %}

{% block title %}Login | Employee Management{% endblock %}

{% block content %}
<section class="panel">
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div class="form-row">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <div class="actions">
            <button type="submit">Login</button>
            <a class="button secondary" href="{% url 'register' %}">Create Account</a>
        </div>
    </form>
</section>
{% endblock %}
