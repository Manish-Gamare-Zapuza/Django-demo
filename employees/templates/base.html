<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Employee Management{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #1f2937;
            background: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 24px;
            color: #ffffff;
            background: #111827;
        }

        .brand {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-links a,
        .logout-button {
            color: #ffffff;
            font: inherit;
            background: none;
            border: 0;
            cursor: pointer;
        }

        .logout-form {
            margin: 0;
        }

        .container {
            width: min(1100px, calc(100% - 32px));
            margin: 32px auto;
        }

        .panel {
            padding: 24px;
            background: #ffffff;
            border: 1px solid #d8e0eb;
            border-radius: 8px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        h1,
        h2 {
            margin: 0 0 12px;
            color: #111827;
        }

        p {
            line-height: 1.6;
        }

        .button,
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 8px 14px;
            color: #ffffff;
            background: #2563eb;
            border: 1px solid #2563eb;
            border-radius: 6px;
            font: inherit;
            cursor: pointer;
        }

        .button.secondary {
            color: #1f2937;
            background: #ffffff;
            border-color: #cbd5e1;
        }

        .button.danger,
        button.danger {
            background: #dc2626;
            border-color: #dc2626;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            color: #374151;
            background: #eef2f7;
            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .messages {
            display: grid;
            gap: 8px;
            margin-bottom: 18px;
        }

        .message {
            padding: 12px 14px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 6px;
        }

        form {
            display: grid;
            gap: 14px;
        }

        .form-row label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        .errorlist {
            margin: 6px 0 0;
            padding-left: 18px;
            color: #b91c1c;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .detail-item {
            padding: 14px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
        }

        .detail-item strong {
            display: block;
            margin-bottom: 6px;
            color: #475569;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .navbar,
            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{% url 'home' %}">Employee Management</a>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'employee_list' %}">Employees</a>
                <a href="{% url 'employee_create' %}">Add Employee</a>
                <span>{{ user.username }}</span>
                <form class="logout-form" method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="logout-button" type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
